<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>记忆与历史 · Dev Assistant</title><link rel="stylesheet" href="/static/style.css"><script type="module" src="/static/memory.mjs"></script></head>
<body class="knowledge-page"><aside class="sidebar"><a class="brand" href="/">dev assistant<small>← 返回聊天</small></a>
<label for="memory-conversation">选择会话</label><select id="memory-conversation"><option value="">请选择</option></select>
<div class="sidebar-bottom">长期记忆需要明确确认。未确认候选、摘要和历史回答不会自动变成事实。</div></aside>
<main><header><a href="/">← 返回聊天</a><strong>记忆与历史</strong></header><div class="knowledge-content">
<div id="memory-message" role="status">选择一个已保存的会话，查看范围和记忆。</div>
<section id="memory-workspace" hidden><h1>当前记忆范围</h1><p id="scope-label"></p>
<section class="kb-card"><h2>长期记忆</h2><p>确认后，同一范围的新会话可以召回。撤回后停止新的长期记忆召回，但不会改写已有聊天记录。</p>
<form id="memory-propose"><label class="sr-only" for="memory-content">候选内容</label><input id="memory-content" required maxlength="1200" placeholder="例如：本项目统一使用 Python 3.12">
<label class="sr-only" for="memory-kind">类型</label><select id="memory-kind"><option value="fact">事实</option><option value="decision">决策</option><option value="preference">偏好</option><option value="task">任务</option></select><button>提交待确认候选</button></form>
<div id="memory-items"></div></section>
<section class="kb-card"><h2>上下文摘要</h2><p id="summary-status"></p><pre id="memory-summary" class="memory-summary"></pre></section>
<section class="kb-card"><h2>原始历史</h2><p>按轮次保留用户消息与最终回答；不展示模型内部推理或原始工具内容。旧版本已丢弃的消息无法恢复。</p><div id="memory-transcript"></div><button id="memory-more" hidden>加载更多轮次</button></section>
</section></div></main></body></html>
