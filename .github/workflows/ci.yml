name: checks
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    env:
      AGENT_MODE: single
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.lock
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_sse.mjs tests/test_markdown.mjs
      - run: node --check static/app.mjs
      - run: node --check static/knowledge.mjs
      - run: node --check static/memory.mjs
      - run: python evaluate.py
  infrastructure:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://devassistant:devassistant_local@127.0.0.1:54329/devassistant
      MILVUS_URI: http://127.0.0.1:19539
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock
      - run: cp .env.example .env
      - run: docker compose up -d --wait postgres milvus
      - run: python scripts/check_infrastructure.py
      - if: always()
        run: docker compose logs --tail 30 postgres milvus
      - if: always()
        run: docker compose down
